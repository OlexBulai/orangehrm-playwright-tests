name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Select tests to run
        required: true
        default: all
        type: choice
        options:
          - all
          - my-info
          - admin

jobs:
  test:
    name: Run Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      USERNAME_LOGIN: ${{ secrets.USERNAME_LOGIN }}
      PASSWORD_LOGIN: ${{ secrets.PASSWORD_LOGIN }}
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run all tests
        if: ${{ inputs.test_suite == 'all' }}
        run: npx playwright test

      - name: Run My Info tests
        if: ${{ inputs.test_suite == 'my-info' }}
        run: npx playwright test tests/my-info

      - name: Run Admin tests
        if: ${{ inputs.test_suite == 'admin' }}
        run: npx playwright test tests/admin

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ inputs.test_suite }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
