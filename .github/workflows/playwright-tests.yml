name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Select tests to run
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - auth
          - readonly
          - mutation
          - my-info
          - admin

env:
  USERNAME_LOGIN: ${{ secrets.USERNAME_LOGIN }}
  PASSWORD_LOGIN: ${{ secrets.PASSWORD_LOGIN }}
  BASE_URL: ${{ secrets.BASE_URL }}
  CI_WORKERS: 1

jobs:
  quality:
    name: TypeScript check
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check lint rules
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Verify test discovery
        run: npm run test:list -- --project=chromium

  smoke:
    name: Chromium smoke tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: quality
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-smoke
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  selected-suite:
    name: Run selected Playwright suite
    if: github.event_name == 'workflow_dispatch' && inputs.test_suite != 'all'
    needs: quality
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        if: ${{ inputs.test_suite == 'smoke' }}
        run: npm run test:smoke

      - name: Run auth tests
        if: ${{ inputs.test_suite == 'auth' }}
        run: npm run test:auth

      - name: Run read-only tests
        if: ${{ inputs.test_suite == 'readonly' }}
        run: npm run test:readonly

      - name: Run mutation tests
        if: ${{ inputs.test_suite == 'mutation' }}
        run: npm run test:mutation

      - name: Run My Info tests safely
        if: ${{ inputs.test_suite == 'my-info' }}
        run: |
          npx playwright test tests/my-info --project=chromium --grep-invert @mutation
          npx playwright test tests/my-info --project=chromium --grep @mutation --workers=1

      - name: Run Admin tests safely
        if: ${{ inputs.test_suite == 'admin' }}
        run: |
          npx playwright test tests/admin --project=chromium --grep-invert @mutation
          npx playwright test tests/admin --project=chromium --grep @mutation --workers=1

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ inputs.test_suite }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ inputs.test_suite }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  all-auth:
    name: All - auth tests
    if: github.event_name == 'workflow_dispatch' && inputs.test_suite == 'all'
    needs: quality
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run auth tests
        run: npm run test:auth

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-all-auth
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-all-auth
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  all-readonly:
    name: All - read-only tests
    needs: all-auth
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only tests
        run: npm run test:readonly

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-all-readonly
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-all-readonly
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  all-mutation:
    name: All - mutation tests
    needs: all-readonly
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-all-mutation
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-all-mutation
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
